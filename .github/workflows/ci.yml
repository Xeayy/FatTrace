name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: |
          $bad = gofmt -l .
          if ($bad) { Write-Host "gofmt needed:"; Write-Host $bad; exit 1 }
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o fat.exe ./cmd/fat
      - name: Build GUI launcher
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o fatgui.exe ./cmd/fatgui
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Subsystem check
        run: |
          $out = go run ./scripts/pecheck fat.exe fatgui.exe
          Write-Host $out
          if ("$out" -notmatch 'fat\.exe: subsystem=3' -or "$out" -notmatch 'fatgui\.exe: subsystem=2') { exit 1 }
      - name: Cross-build arm64
        run: |
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o fat-arm64.exe ./cmd/fat
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=ci" -o fatgui-arm64.exe ./cmd/fatgui
      - name: Doctor smoke test
        run: |
          .\fat.exe db init
          .\fat.exe config init -roots $env:TEMP
          .\fat.exe doctor --skip-tasks
