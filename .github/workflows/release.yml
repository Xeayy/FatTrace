name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build dual-arch artifacts and installer
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          powershell -ExecutionPolicy Bypass -File scripts/release.ps1 -Version $ver
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          # 发布正文直接取 docs/release-<tag>.md（UTF-8），
          # 避免手工上传正文时中文被转码成问号
          body_path: docs/release-${{ github.ref_name }}.md
          generate_release_notes: true
